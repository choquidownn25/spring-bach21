server:
  port: 8084

spring:
  application:
    name: spring-bach


  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  datasource:
    url: jdbc:mysql://localhost:3306/mi_basedatos?createDatabaseIfNotExist=true&autoReconnect=true&useSSL=false&serverTimezone=UTC
    username: root
    password: ""

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

    show-sql: true